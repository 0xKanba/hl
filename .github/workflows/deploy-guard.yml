name: Deploy Guard

on:
  push:
    branches:
      - demo

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check missing files
        run: |

          echo "=== SCANNING PROJECT ==="

          FAILED=0

          find . -type f \
            ! -path "./.git/*" \
            ! -path "./.github/*" \
            | while read FILE
          do

            NAME=$(basename "$FILE")

            if [ ! -f "$FILE" ]; then
              echo "❌ مفقود: $NAME"
              FAILED=1
            fi

          done

          exit $FAILED
