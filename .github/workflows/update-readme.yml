name: Auto Update Project Tree

on:
  push:

jobs:
  update-structure:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect added/deleted files only
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          BASE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"

          # أول push أو branch جديد: شغّل بأمان
          if [[ "$BASE" =~ ^0+$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="$(git diff --name-status "$BASE" "$HEAD" || true)"
          echo "$CHANGED"

          if echo "$CHANGED" | awk '$1 ~ /^(A|D|R)/ {found=1} END {exit !found}'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if only modified files
        if: steps.detect.outputs.run != 'true'
        run: echo "Only modified files. Nothing to update."

      - name: Update files.json map
        if: steps.detect.outputs.run == 'true'
        run: |
          mkdir -p md
          shopt -s nullglob

          printf '[' > md/files.json
          first=true

          for f in md/*.md; do
            name=$(basename "$f" .md)
            if $first; then
              first=false
            else
              printf ',' >> md/files.json
            fi
            printf '"%s"' "$name" >> md/files.json
          done

          printf ']' >> md/files.json

      - name: Update README.md structure
        if: steps.detect.outputs.run == 'true'
        run: |
          tree -I '.git|.github|node_modules' --charset utf-8 > tree.txt

          cat > new_tree.txt <<'EOF'
             <!-- TREE START -->

              # 📂 repo tree

                 ```text
                     EOF
              cat tree.txt >> new_tree.txt
              cat >> new_tree.txt <<'EOF'
