<!-- استبدل كتلة modalClose الموجودة في index.html بهذه الكتلة كاملة -->

<div class="modal-overlay overlay-fs" id="modalClose">
  <div class="modal modal-fs">
    <div class="modal-handle"></div>
    <h3 class="modal-title" id="closeTitle">إغلاق الصفقة</h3>
    <p class="modal-subtitle" id="closeSubtitle">إغلاق جزئي أو كامل بالسعر الحالي</p>
    <div class="confirm-details" id="closeDetails"></div>

    <!-- أدوات الإغلاق الجزئي الديناميكية -->
    <div class="partial-close-wrap">

      <!-- رأس: تسمية + نسبة مئوية كبيرة -->
      <div class="pc-header">
        <span class="pc-lbl">حجم الإغلاق</span>
        <span class="pc-pct-lbl" id="closePctLabel">100%</span>
      </div>

      <!-- حقل الكمية + وحدة -->
      <div class="pc-qty-row">
        <input type="number"
               class="pc-qty-input"
               id="closeQtyInput"
               min="0"
               step="any"
               inputmode="decimal"
               placeholder="0.00">
        <span class="pc-unit" id="closeQtyUnit">—</span>
      </div>

      <!-- شريط التمرير (اللون يُحدَّث بـ JS) -->
      <input type="range"
             class="pc-slider"
             id="closePctSlider"
             min="0"
             max="100"
             value="100"
             step="0.5">

      <!-- أزرار النسب السريعة -->
      <div class="pc-presets">
        <button class="pc-preset" data-pct="25">25%</button>
        <button class="pc-preset" data-pct="50">50%</button>
        <button class="pc-preset" data-pct="75">75%</button>
        <button class="pc-preset active" data-pct="100">100%</button>
      </div>

      <!-- معلومات المتبقي + تقدير الربح -->
      <div class="pc-remain" id="closeRemain"></div>

    </div>

    <div class="modal-buttons">
      <button class="btn-modal btn-cancel"             id="closeCancel">إبقاء</button>
      <button class="btn-modal btn-confirm btn-danger" id="closeExecute">إغلاق الكل ✕</button>
    </div>
  </div>
</div>
