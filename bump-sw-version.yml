name: Bump service worker cache version

# Any push that changes the app shell gets a fresh sw.js cache tag,
# committed back automatically. sw.js itself is excluded from the
# trigger so this workflow can never re-trigger itself.
"on":
  push:
    branches: [kanba]
    paths:
      - '**.html'
      - 'css/**'
      - 'js/**'
      - 'manifest.json'
      - '!sw.js'

permissions:
  contents: write

concurrency:
  group: sw-version-bump
  cancel-in-progress: false

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Debug trigger context
        run: |
          echo "ref: ${{ github.ref }}"
          echo "ref_name: ${{ github.ref_name }}"
          echo "actor: ${{ github.actor }}"
          echo "sha: ${{ github.sha }}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Compute version tag
        id: ver
        run: echo "tag=$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Bump CACHE_APP / CACHE_IMGS / CACHE_FONTS in sw.js
        run: |
          set -e
          TAG="${{ steps.ver.outputs.tag }}"
          test -f sw.js || (echo "::error::sw.js not found at repo root" && exit 1)
          sed -i -E "s/(CACHE_APP[[:space:]]*=[[:space:]]*')[^']*(')/\1hltrade-app-${TAG}\2/" sw.js
          sed -i -E "s/(CACHE_IMGS[[:space:]]*=[[:space:]]*')[^']*(')/\1hltrade-img-${TAG}\2/" sw.js
          sed -i -E "s/(CACHE_FONTS[[:space:]]*=[[:space:]]*')[^']*(')/\1hltrade-fnt-${TAG}\2/" sw.js
          grep -q "$TAG" sw.js || (echo "::error::sed did not match — check CACHE_* constant format in sw.js" && exit 1)

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- sw.js; then
            echo "No version change needed"
            exit 0
          fi
          git add sw.js
          git commit -m "chore: bump sw.js cache version to ${{ steps.ver.outputs.tag }}"
          git push origin HEAD:${{ github.ref_name }}
